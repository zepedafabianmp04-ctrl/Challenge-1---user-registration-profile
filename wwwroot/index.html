<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - ProductService</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --input-bg: #0f172a;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border-color);
        }

        /* Navegación por pestañas */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: #818cf8;
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #818cf8;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button.btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-top: 18px;
            display: none;
            text-align: center;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #059669;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #dc2626;
        }

        /* Tabla de consulta */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: var(--input-bg);
            color: #818cf8;
        }

        .badge-active {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Navegación por pestañas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('registerTab', this)">Registro</button>
            <button class="tab-btn" onclick="switchTab('loginTab', this)">Iniciar Sesión</button>
            <button class="tab-btn" onclick="switchTab('usersTab', this); loadUsers();">Consultar Usuarios</button>
        </div>

        <!-- Mensajes de alerta generales -->
        <div id="alertMessage" class="alert"></div>

        <!-- 1. PESTAÑA REGISTRO -->
        <div id="registerTab" class="tab-content active">
            <h2>Registro de Usuario</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="reg-username">Username</label>
                    <input type="text" id="reg-username" maxlength="50" required placeholder="Ej. JulioCesar">
                </div>

                <div class="form-group">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" maxlength="100" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" maxlength="255" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
        </div>

        <!-- 2. PESTAÑA INICIAR SESIÓN -->
        <div id="loginTab" class="tab-content">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" required placeholder="ejemplo@correo.com">
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </div>

        <!-- 3. PESTAÑA CONSULTA DE USUARIOS -->
        <div id="usersTab" class="tab-content">
            <h2>Usuarios Registrados</h2>
            <div id="usersTableContainer">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center;">Cargando usuarios...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Función para alternar pestañas
        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');

            // Ocultar alertas al cambiar de pestaña
            showAlert('', false);
        }

        // Mostrar mensajes de alerta
        function showAlert(msg, isSuccess) {
            const alertBox = document.getElementById('alertMessage');
            if (!msg) {
                alertBox.style.display = 'none';
                return;
            }
            alertBox.className = isSuccess ? 'alert alert-success' : 'alert alert-error';
            alertBox.textContent = msg;
            alertBox.style.display = 'block';
        }

        // --- 1. REGISTRAR USUARIO (POST /api/Users) ---
        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            showAlert('', false);

            const data = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                passwordHash: document.getElementById('reg-password').value
            };

            try {
                const response = await fetch('/api/Users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('¡Usuario registrado exitosamente!', true);
                    document.getElementById('registerForm').reset();
                } else {
                    const errorData = await response.json().catch(() => null);
                    let errorMsg = 'Error al registrar el usuario.';
                    if (errorData) {
                        if (errorData.message) errorMsg = errorData.message;
                        else if (errorData.errors) errorMsg = Object.values(errorData.errors).flat().join(' ');
                    }
                    showAlert(errorMsg, false);
                }
            } catch (error) {
                showAlert('Error de conexión con el servidor backend.', false);
            }
        });

        // --- 2. INICIAR SESIÓN (Consulta usuarios y valida el Email) ---
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            showAlert('', false);

            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            try {
                const response = await fetch('/api/Users');
                if (response.ok) {
                    const users = await response.json();
                    
                    // Buscar usuario por correo
                    const user = users.find(u => u.email.toLowerCase() === email);

                    if (user) {
                        showAlert(`¡Bienvenido de nuevo, ${user.username}! Sesión iniciada con éxito.`, true);
                        document.getElementById('loginForm').reset();
                    } else {
                        showAlert('Credenciales incorrectas o usuario no encontrado.', false);
                    }
                } else {
                    showAlert('Error al verificar las credenciales con el servidor.', false);
                }
            } catch (error) {
                showAlert('Error de conexión con el servidor backend.', false);
            }
        });

        // --- 3. CONSULTAR USUARIOS (GET /api/Users) ---
        async function loadUsers() {
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">Cargando usuarios...</td></tr>';

            try {
                const response = await fetch('/api/Users');
                if (response.ok) {
                    const users = await response.json();
                    
                    if (users.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center;">No hay usuarios registrados aún.</td></tr>';
                        return;
                    }

                    tableBody.innerHTML = users.map(user => `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.username}</td>
                            <td>${user.email}</td>
                            <td><span class="badge-active">Activo</span></td>
                        </tr>
                    `).join('');
                } else {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--error-color);">Error al cargar los usuarios.</td></tr>';
                }
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--error-color);">Error de conexión con el servidor.</td></tr>';
            }
        }
    </script>

</body>
</html>
